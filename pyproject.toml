[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abhiprime"
version = "2.0.0"
authors = [
    {name = "abhi1628", email = "your.email@example.com"},
]
description = "A powerful Python package for prime number operations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["prime", "number-theory", "mathematics", "sieve", "cryptography"]

[project.urls]
Homepage = "https://github.com/abhi1628/prime-number-python-package"
Documentation = "https://github.com/abhi1628/prime-number-python-package#readme"
Repository = "https://github.com/abhi1628/prime-number-python-package"
Issues = "https://github.com/abhi1628/prime-number-python-package/issues"

[project.scripts]
abhiprime = "abhiprime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["abhiprime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
